apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: finalproject-gitops
  labels: { app: task-api }
spec:
  # The number Argo CD will defend. Scaling this with `kubectl scale` is drift,
  # and selfHeal puts it back -- demonstrated in the module README.
  replicas: 2
  selector:
    matchLabels: { app: task-api }
  template:
    metadata:
      labels: { app: task-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: api
          image: task-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef: { name: task-api-config }
            - secretRef:    { name: task-api-secret }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m,  memory: 48Mi }
            limits:   { cpu: 300m, memory: 192Mi }
