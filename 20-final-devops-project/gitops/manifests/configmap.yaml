apiVersion: v1
kind: ConfigMap
metadata:
  name: task-api-config
  namespace: finalproject-gitops
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  FEATURE_METRICS: "true"
  APP_VERSION: "1.0.0"
  # This copy writes to the container's own emptyDir rather than a PVC, so no
  # stateful resource is under prune control. See README.md in this directory.
  DATA_DIR: "/tmp"
