# EXAMPLE ONLY — never commit a filled-in copy.
# Create the real Secret out of band:
#
#   kubectl -n finalproject create secret generic task-api-secret \
#     --from-literal=DB_PASSWORD='<real>' --from-literal=API_KEY='<real>'
#
# Use --from-literal, not `echo | base64`, which appends a newline into the
# credential (module 11 demonstrates that bug).
apiVersion: v1
kind: Secret
metadata:
  name: task-api-secret
  namespace: finalproject
type: Opaque
stringData:
  DB_PASSWORD: REPLACE_ME
  API_KEY: REPLACE_ME
