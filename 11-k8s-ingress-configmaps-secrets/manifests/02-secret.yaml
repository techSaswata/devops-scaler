# A Secret holding database credentials.
#
# CRITICAL: the values below are BASE64-ENCODED, which is NOT encryption.
# Anyone with read access to this object can decode them instantly. Base64 is
# here so that binary values (certificates, keys) can be stored in YAML - not
# for secrecy.
#
# Generated with `echo -n`, NOT plain `echo`. Plain echo appends a newline,
# which becomes part of the credential and causes authentication to fail with
# a completely unhelpful error. The lab demonstrates this deliberately.
apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
  namespace: default
  labels: { app: yatri-app }
type: Opaque
data:
  # echo -n "yatri_admin"         | base64
  POSTGRES_USER: eWF0cmlfYWRtaW4=
  # echo -n "secretpassword"      | base64
  POSTGRES_PASSWORD: c2VjcmV0cGFzc3dvcmQ=
  # echo -n "yatri_production_db" | base64
  POSTGRES_DB: eWF0cmlfcHJvZHVjdGlvbl9kYg==
