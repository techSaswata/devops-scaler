# Plain-text configuration, decoupled from the container image.
# Nothing sensitive belongs here - see 02-secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-app-config
  namespace: default
  labels: { app: yatri-app }
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  APP_PORT: "5000"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
---
# A SECOND ConfigMap holding a whole FILE rather than key-value pairs.
# This is the other way to consume a ConfigMap: mounted as a volume.
# It matters because volume-mounted keys update LIVE in a running pod,
# while env-var keys do not (demonstrated in the lab).
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-frontend-html
  namespace: default
  labels: { app: yatri-app }
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Yatri — Frontend</title>
      <style>
        :root{--bg:#0f1117;--card:#171a23;--line:#252a38;--fg:#e6e9f0;
              --muted:#8b93a7;--accent:#4f9cf9}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--fg);min-height:100vh;
             display:grid;place-items:center;padding:24px;
             font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        .card{background:var(--card);border:1px solid var(--line);
              border-radius:16px;padding:44px 52px;max-width:600px;width:100%;
              box-shadow:0 24px 60px rgba(0,0,0,.5)}
        .badge{display:inline-block;font-size:12px;font-weight:600;
               letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
               background:rgba(79,156,249,.14);border:1px solid rgba(79,156,249,.3);
               padding:6px 12px;border-radius:999px;margin-bottom:22px}
        h1{font-size:40px;line-height:1.1;margin-bottom:12px}
        h1 span{color:var(--accent)}
        p{color:var(--muted);font-size:15px;line-height:1.6}
        code{font-family:ui-monospace,'SF Mono',Menlo,monospace;color:var(--accent)}
        dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:14px;
           border-top:1px solid var(--line);padding-top:22px;margin-top:24px}
        dt{color:var(--muted)}
        dd{font-family:ui-monospace,'SF Mono',Menlo,monospace}
        .foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
              color:var(--muted);font-size:13px}
      </style>
    </head>
    <body>
      <div class="card">
        <div class="badge">Yatri &middot; Frontend</div>
        <h1>Hello from the <span>Frontend</span></h1>
        <p>This page is served by Nginx. The HTML itself comes from a
           <code>ConfigMap</code> mounted as a volume, not baked into the image.</p>
        <dl>
          <dt>Served by</dt><dd>yatri-frontend (nginx)</dd>
          <dt>Reached via</dt><dd>Ingress path /</dd>
          <dt>Host</dt><dd>yatri.local</dd>
          <dt>API</dt><dd>try /api/</dd>
        </dl>
        <p class="foot">Saswata Das &middot; 24BCS10248 &middot; DevOps Homework</p>
      </div>
    </body>
    </html>
