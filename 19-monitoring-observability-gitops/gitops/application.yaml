# An Argo CD Application: the link between a git path and a cluster namespace.
# This is the whole GitOps contract - git is the source of truth, and the agent
# in the cluster pulls.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/techSaswata/devops-scaler.git
    targetRevision: main
    path: 19-monitoring-observability-gitops/gitops/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      # prune: delete resources removed from git.
      # Without it, deleting a file from git leaves the object orphaned in the
      # cluster forever.
      prune: true
      # selfHeal: revert manual kubectl changes back to what git says.
      # This is what makes the cluster CONVERGE rather than merely deploy.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 1m }
