# A workload to monitor. It exposes Prometheus metrics on /metrics, so a
# ServiceMonitor can scrape it and the data shows up in Grafana.
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-app
  namespace: monitoring
data:
  app.py: |
    import os, random, time, threading
    from http.server import HTTPServer, BaseHTTPRequestHandler

    REQS = {"200": 0, "404": 0, "500": 0}
    LAT  = []
    START = time.time()

    class H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass

        def do_GET(self):
            if self.path == "/metrics":
                return self.metrics()
            if self.path == "/health":
                return self.send_text(200, "ok")
            # Simulate a realistic mix of outcomes and latencies so the
            # dashboards and alert rules have something to show.
            t0 = time.time()
            r = random.random()
            code = 200 if r < 0.85 else (404 if r < 0.95 else 500)
            time.sleep(random.uniform(0.005, 0.12))
            REQS[str(code)] += 1
            LAT.append(time.time() - t0)
            del LAT[:-500]
            self.send_text(code, f"status {code}")

        def send_text(self, code, body):
            b = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)

        def metrics(self):
            total = sum(REQS.values())
            avg = (sum(LAT) / len(LAT)) if LAT else 0
            lines = [
                "# HELP demo_requests_total Total HTTP requests by status code.",
                "# TYPE demo_requests_total counter",
            ]
            for code, n in REQS.items():
                lines.append(f'demo_requests_total{{code="{code}"}} {n}')
            lines += [
                "# HELP demo_request_latency_seconds Average request latency.",
                "# TYPE demo_request_latency_seconds gauge",
                f"demo_request_latency_seconds {avg:.6f}",
                "# HELP demo_uptime_seconds Seconds since start.",
                "# TYPE demo_uptime_seconds counter",
                f"demo_uptime_seconds {time.time() - START:.1f}",
                "# HELP demo_up Always 1 when scrapeable.",
                "# TYPE demo_up gauge",
                "demo_up 1",
            ]
            self.send_text(200, "\n".join(lines) + "\n")

    HTTPServer(("0.0.0.0", 8000), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-app
  namespace: monitoring
  labels: { app: metrics-app }
spec:
  replicas: 2
  selector: { matchLabels: { app: metrics-app } }
  template:
    metadata: { labels: { app: metrics-app } }
    spec:
      volumes:
        - name: code
          configMap: { name: metrics-app }
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "/app/app.py"]
          volumeMounts: [{ name: code, mountPath: /app }]
          ports: [{ containerPort: 8000, name: metrics }]
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-app
  namespace: monitoring
  labels: { app: metrics-app }
spec:
  selector: { app: metrics-app }
  ports: [{ port: 8000, targetPort: metrics, name: metrics }]
---
# A ServiceMonitor is how the Prometheus Operator is told to scrape something.
# You do not edit prometheus.yml - you create this CRD and the operator
# regenerates the config.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metrics-app
  namespace: monitoring
  labels: { release: monitoring }
spec:
  selector:
    matchLabels: { app: metrics-app }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
