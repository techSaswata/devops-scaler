# Trimmed kube-prometheus-stack values for a local kind cluster.
# The full chart assumes a multi-node production cluster; these overrides keep
# it inside a laptop's resources.

grafana:
  adminPassword: admin          # demo only - a real install uses a Secret
  service:
    type: NodePort
    nodePort: 30300
  persistence:
    enabled: false              # no PVC needed for a demo
  resources:
    requests: { cpu: 50m, memory: 128Mi }

prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    retention: 2h               # short retention; this is not a real TSDB
    resources:
      requests: { cpu: 100m, memory: 400Mi }
    storageSpec: {}             # emptyDir
    # Watch ServiceMonitors in every namespace, not just the release namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  service:
    type: NodePort
    nodePort: 30903
  alertmanagerSpec:
    resources:
      requests: { cpu: 20m, memory: 64Mi }

# kind nodes do not expose these control-plane endpoints, so the default
# scrape jobs for them would sit permanently "down" and clutter the targets
# page with failures that are not real.
kubeControllerManager: { enabled: false }
kubeScheduler:         { enabled: false }
kubeEtcd:              { enabled: false }
kubeProxy:             { enabled: false }

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
