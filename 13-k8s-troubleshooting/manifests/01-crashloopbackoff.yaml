# BROKEN: the container exits 1 every time it starts.
# Symptom: CrashLoopBackOff, restart count climbing.
apiVersion: v1
kind: Pod
metadata: { name: ts-crashloop, labels: { drill: troubleshooting } }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","echo 'starting...'; sleep 2; echo 'FATAL: config file /etc/app/config.yaml not found'; exit 1"]
