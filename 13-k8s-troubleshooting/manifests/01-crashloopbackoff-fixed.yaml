# FIXED: the missing config is supplied, so the process stays up.
apiVersion: v1
kind: ConfigMap
metadata: { name: ts-app-config }
data:
  config.yaml: "mode: production"
---
apiVersion: v1
kind: Pod
metadata: { name: ts-crashloop-fixed, labels: { drill: troubleshooting } }
spec:
  volumes:
    - name: cfg
      configMap: { name: ts-app-config }
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","echo 'starting...'; test -f /etc/app/config.yaml && echo 'config found, running' && sleep infinity"]
      volumeMounts: [{ name: cfg, mountPath: /etc/app }]
