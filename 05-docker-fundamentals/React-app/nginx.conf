server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: a React router handles the path client-side, so any unknown
    # URL must still return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are content-addressed, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","app":"react-app"}';
    }
}
