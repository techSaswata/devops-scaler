apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  labels: { app: cicd-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: cicd-demo } }
  template:
    metadata: { labels: { app: cicd-demo } }
    spec:
      containers:
        - name: app
          # Replaced by the CD pipeline with the real published tag.
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 5000, name: http }]
          env:
            - name: APP_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
