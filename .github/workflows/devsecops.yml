# ============================================================================
#  DEVSECOPS PIPELINE — Session 17
#
#  Code → Build → Unit Test → SAST → SCA → Secret Scan → Docker Build
#       → Container Image Scan → SECURITY GATE → Push → Deploy
#
#  The gate is structural: `push` has `needs: [security-gate]`, so no image can
#  reach the registry unless every scan passed. Security is not advisory here.
# ============================================================================
name: DevSecOps

on:
  push:
    branches: [main]
    paths:
      - '16-devsecops/**'
      - '.github/workflows/devsecops.yml'
  pull_request:
    paths: ['16-devsecops/**']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/devsecops-demo

jobs:
  # ========================= BUILD + UNIT TEST ============================
  test:
    name: Build and unit test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 16-devsecops/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest tests/ -v --cov=src --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: 16-devsecops/app/coverage.xml, retention-days: 7 }

  # ================================ SAST ==================================
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 16-devsecops/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install bandit
      - name: Scan source for insecure patterns
        run: |
          # bandit exits non-zero on ANY finding, including LOW. The gate below
          # is what decides pass/fail, so this step only reports.
          bandit -r src/ -c ../security/bandit.yaml -f screen || true
          bandit -r src/ -c ../security/bandit.yaml -f json -o bandit-report.json || true
      - name: Fail on HIGH severity findings
        run: |
          HIGH=$(python -c "import json;d=json.load(open('bandit-report.json'));print(sum(1 for r in d['results'] if r['issue_severity']=='HIGH'))")
          echo "HIGH severity findings: $HIGH"
          [ "$HIGH" -eq 0 ] || { echo '::error::SAST gate failed'; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sast-report, path: 16-devsecops/app/bandit-report.json, retention-days: 7 }

  # ================================= SCA ==================================
  sca:
    name: SCA (pip-audit + Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: pip-audit — CVEs in declared dependencies
        working-directory: 16-devsecops/app
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc || echo "::warning::pip-audit reported findings"
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: 16-devsecops/app
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'          # this is the gate
          format: table

  # =========================== SECRET SCANNING ============================
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history - secrets hide in old commits
      - name: Install and run gitleaks
        # The official action requires a licence key for organisation accounts
        # and hides its failure reason. Running the binary directly is simpler
        # and the output is visible in the log.
        run: |
          set -euo pipefail
          # PINNED, and both halves of that matter.
          #
          # This step used to resolve "latest" from the unauthenticated GitHub
          # API. That broke a previously green gate twice over. The API call is
          # rate-limited per runner IP, so on a busy runner it returns a message
          # instead of a release and ${VER} comes back EMPTY -- the download URL
          # then 404s, tar is fed an HTML error page, and the step dies in under
          # a second with no explanation. And gitleaks 8.30 REMOVED the `detect`
          # subcommand in favour of `git` and `dir`, so even a successful
          # download would have failed on the next line. A floating version in a
          # security gate means an upstream release can turn the gate red (or,
          # worse, change what it finds) with no commit of mine involved.
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks version
          # `git` scans HISTORY, which is the point: a secret that was committed
          # and then deleted is still a leaked secret. `dir` would only see the
          # current working tree.
          ./gitleaks git . \
            --config 16-devsecops/security/.gitleaks.toml \
            --redact --verbose --no-banner \
            --report-format json --report-path gitleaks-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: secret-scan-report, path: gitleaks-report.json, retention-days: 7 }

  # ===================== DOCKER BUILD + IMAGE SCAN ========================
  image-scan:
    name: Docker build and image scan
    runs-on: ubuntu-latest
    needs: [test, sast]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed yet - it must pass the scan first)
        uses: docker/build-push-action@v6
        with:
          context: 16-devsecops/app
          push: false
          load: true
          tags: devsecops-demo:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-demo:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'          # the gate
          format: table
      - name: Trivy SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-demo:scan
          format: cyclonedx
          output: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cyclonedx.json, retention-days: 7 }

  # ============================ SECURITY GATE =============================
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [test, sast, sca, secret-scan, image-scan]
    steps:
      - name: All controls passed
        run: |
          echo "## Security gate: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "| control | result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| unit tests   | ${{ needs.test.result }} |"        >> $GITHUB_STEP_SUMMARY
          echo "| SAST         | ${{ needs.sast.result }} |"        >> $GITHUB_STEP_SUMMARY
          echo "| SCA          | ${{ needs.sca.result }} |"         >> $GITHUB_STEP_SUMMARY
          echo "| secret scan  | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| image scan   | ${{ needs.image-scan.result }} |"  >> $GITHUB_STEP_SUMMARY

  # ============================ PUSH + DEPLOY =============================
  push:
    name: Push image
    runs-on: ubuntu-latest
    needs: [security-gate]        # <- THE GATE. No gate pass, no push.
    if: github.event_name != 'pull_request'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: 16-devsecops/app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    needs: [push]
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate
        run: |
          cd 16-devsecops/k8s
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}|" deployment.yaml
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary deployment.yaml
      - name: Scan the manifests for misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: 16-devsecops/k8s
          severity: HIGH,CRITICAL
          format: table
