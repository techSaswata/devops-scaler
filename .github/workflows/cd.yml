# ============================================================================
#  CD PIPELINE — Session 16
#  Runs only after CI succeeds on main. Publishes the image to GHCR and
#  renders the Kubernetes manifests that would deploy it.
# ============================================================================
name: CD

on:
  workflow_run:
    # CD is triggered by the CI workflow COMPLETING, not by the push itself.
    # That is what makes it a pipeline rather than two unrelated workflows.
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cicd-demo

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    # Only proceed if CI actually passed. Without this guard, a red CI run
    # would still publish an image.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write        # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is injected automatically by Actions - no secret to
          # create or rotate. This is the preferred way to auth to GHCR.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        # Required to build for an architecture the runner is not. GitHub-hosted
        # runners are amd64, so arm64 layers are emulated.
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: 15-cicd-github-actions/app
          push: true
          # MULTI-ARCH. Without this the image is amd64-only and cannot be
          # pulled on an Apple Silicon machine:
          #   no matching manifest for linux/arm64/v8 in the manifest list entries
          # That is a real failure this pipeline hit before the platforms line
          # was added.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Render Kubernetes manifests
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Substitute the image tag into the manifests
        run: |
          cd 15-cicd-github-actions/k8s
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|g" deployment.yaml
          echo "--- rendered deployment.yaml ---"
          cat deployment.yaml

      - name: Validate the manifests
        run: |
          cd 15-cicd-github-actions/k8s
          # NOTE: `kubectl apply --dry-run=client` is NOT usable here. Despite the
          # name it still contacts a cluster to download the OpenAPI schema, and
          # a GitHub-hosted runner has none:
          #   failed to download openapi: dial tcp [::1]:8080: connect: connection refused
          # kubeconform validates against the published Kubernetes JSON schemas
          # entirely offline, which is what a CI runner actually needs.
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          ./kubeconform -strict -summary deployment.yaml service.yaml

      - name: Note on the real deploy step
        run: |
          echo "## Deploy" >> $GITHUB_STEP_SUMMARY
          echo "Manifests rendered and validated. A cluster-connected runner would now run:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "kubectl apply -f deployment.yaml -f service.yaml" >> $GITHUB_STEP_SUMMARY
          echo "kubectl rollout status deployment/cicd-demo" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The kind cluster used elsewhere in this repo runs on a laptop and is not" >> $GITHUB_STEP_SUMMARY
          echo "reachable from a GitHub-hosted runner, so the apply is demonstrated locally" >> $GITHUB_STEP_SUMMARY
          echo "instead - see the module README." >> $GITHUB_STEP_SUMMARY
