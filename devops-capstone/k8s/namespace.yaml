apiVersion: v1
kind: Namespace
metadata:
  name: clinicflow
  labels:
    app.kubernetes.io/name: clinicflow
    # Opt the whole namespace into Pod Security Admission at `restricted`.
    # Every pod in this chart already satisfies it (non-root, no privilege
    # escalation, all capabilities dropped, seccomp RuntimeDefault); enforcing
    # it here means a future manifest that does NOT is rejected by the API
    # server rather than quietly running with more privilege than it needs.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
