# A gp3 StorageClass backed by the CSI driver, marked default.
#
# EKS ships exactly one class, `gp2`, and two things are wrong with relying on
# it here. It is NOT marked default on this cluster, so a PVC that omits
# storageClassName binds to nothing and reports
#   "no persistent volumes available for this claim and no storage class is set"
# while the pod sits Pending with an unrelated-looking scheduling message. And
# it still names the in-tree provisioner `kubernetes.io/aws-ebs`, which only
# works through CSI migration.
#
# gp3 is also simply better: cheaper per GB than gp2, with baseline throughput
# and IOPS that do not scale with volume size.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
# Bind only once a pod using the claim is scheduled, so the volume is created in
# the same availability zone as the pod. Immediate binding can place an EBS
# volume in an AZ the pod cannot be scheduled into, which deadlocks.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
