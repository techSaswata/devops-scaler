{{- if .Values.migrations.enabled }}
{{- /*
  NOT a Helm hook, and that is the fix for a deadlock rather than a preference.

  This was originally annotated `helm.sh/hook: pre-install,pre-upgrade` with a
  hook-weight, on the assumption that the weight would order it after Postgres.
  It does not. Hook weights order hooks relative to OTHER HOOKS; every hook in a
  phase runs before any ordinary resource in the release. So on a fresh install
  Helm created this Job first, its init container sat waiting for a Postgres
  that had not been created yet, and the install hung until it timed out --
  `kubectl get pods -n clinicflow` showed exactly one pod, Init:0/1, and no
  database anywhere.

  As an ordinary resource it is applied alongside Postgres, waits for it, and
  migrates. The backend then waits for the schema (see its initContainer), so
  the ordering constraint that actually matters -- no app traffic against an
  un-migrated database -- is enforced where it belongs rather than by hoping
  about hook weights.

  The revision is in the name so each upgrade runs its own Job: a completed Job's
  pod template is immutable, and reusing the name fails with "field is
  immutable" on the second upgrade.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clinicflow.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "clinicflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
      initContainers:
        # Alembic fails immediately rather than retrying, so wait for a real
        # connection instead of sleeping and hoping.
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "clinicflow.fullname" . }}-postgres -U {{ .Values.postgres.username }}; do
                echo "waiting for postgres..."; sleep 3
              done
              echo "postgres is accepting connections"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            capabilities: { drop: ["ALL"] }
      containers:
        - name: alembic
          image: {{ include "clinicflow.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          securityContext: {{- include "clinicflow.containerSecurity" . | nindent 12 }}
          envFrom:
            - configMapRef: { name: {{ include "clinicflow.fullname" . }}-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clinicflow.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
{{- end }}
