{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinicflow.secretName" . }}
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
  annotations:
    # Without this, `helm upgrade` would generate a NEW random password on every
    # release while the running Postgres kept the old one, and the backend would
    # start failing to authenticate against a database that had not changed.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "clinicflow.secretName" .) }}
  {{- if $existing }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
