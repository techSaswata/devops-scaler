# =============================================================================
#  ClinicFlow CI/CD
#
#  test ─┐
#        ├─► images (matrix: backend, frontend)
#  build─┘      build ──► TRIVY SCAN ──► push to GHCR
#                              │
#                        fails on HIGH/CRITICAL
#
#  The scan sits BETWEEN the build and the push, not after it. An image that
#  fails the scan is never published, so a vulnerable tag cannot exist in the
#  registry for someone to pull by accident.
#
#  NOTE ON LOCATION: GitHub only reads workflows from the repository root, so
#  the live copy of this file is at /.github/workflows/clinicflow.yml. This copy
#  is the deliverable kept beside the project it builds; the two are identical.
# =============================================================================
name: ClinicFlow CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'devops-capstone/**'
      - '.github/workflows/clinicflow.yml'
  pull_request:
    paths: ['devops-capstone/**']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PROJECT_DIR: devops-capstone

jobs:
  # ----------------------------------------------------------------- tests ---
  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-capstone/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: devops-capstone/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # No `|| true` anywhere: a failing test must fail the build, which is the
      # entire reason this job runs before the images are built.
      - name: pytest
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - name: Summary
        if: always()
        run: echo "### Backend tests" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: devops-capstone/backend/coverage.xml
          retention-days: 7

  # -------------------------------------------------------- frontend build ---
  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-capstone/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devops-capstone/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Report bundle size
        run: |
          echo "### Frontend bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: devops-capstone/frontend/dist
          retention-days: 7

  # ------------------------------------------- build, scan and push images ---
  images:
    name: Image (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [test, frontend-build]        # no image exists until both are green
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # metadata-action rather than hand-interpolated tags: ${{ github.repository }}
      # is "techSaswata/devops-scaler" with a capital S, and an OCI repository
      # name must be lowercase. This action lowercases `images` for us.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/clinicflow-${{ matrix.component }}
          # SHA-tagged, because "latest" is not a version: it tells you nothing
          # about what is deployed and cannot be rolled back to.
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch

      - name: Build (loaded locally, NOT pushed)
        uses: docker/build-push-action@v6
        with:
          context: devops-capstone/${{ matrix.component }}
          file: devops-capstone/${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: clinicflow-${{ matrix.component }}:scan
          # Scoped per component. Both matrix jobs run concurrently, and with a
          # shared scope they write the same cache manifest at the same time --
          # which produced "error writing layer blob: not_found" on a build that
          # had nothing wrong with it.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy — fail on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clinicflow-${{ matrix.component }}:scan
          severity: HIGH,CRITICAL
          # Unfixed CVEs are ignored on purpose: a vulnerability with no patch
          # available cannot be acted on by this pipeline, and failing on it
          # would train everyone to ignore the gate. Fixable ones block.
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy — full report for the record
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clinicflow-${{ matrix.component }}:scan
          severity: HIGH,CRITICAL,MEDIUM
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-${{ matrix.component }}.txt

      - name: Publish scan to the run summary
        if: always()
        run: |
          echo "### Trivy — ${{ matrix.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-${{ matrix.component }}.txt >> "$GITHUB_STEP_SUMMARY" || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.txt
          retention-days: 7

      # Only reached when the scan exited 0.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: devops-capstone/${{ matrix.component }}
          file: devops-capstone/${{ matrix.component }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}

  # ----------------------------------------------------------------- deploy ---
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [images]
    # Manual only, and honestly so. The EKS cluster for this project is created
    # and destroyed around a demo rather than left running, so an automatic
    # deploy on every push would spend most of its life failing to reach a
    # cluster that does not exist. Run this by hand while the cluster is up.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Check for AWS credentials
        id: creds
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No AWS_ROLE_ARN secret set - skipping the cluster deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.present == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: helm upgrade --install
        if: steps.creds.outputs.present == 'true'
        run: |
          aws eks update-kubeconfig --name clinicflow --region ap-south-1
          helm upgrade --install clinicflow devops-capstone/helm/clinicflow \
            --namespace clinicflow --create-namespace \
            --set backend.image.tag=sha-${{ github.sha }} \
            --set frontend.image.tag=sha-${{ github.sha }} \
            --wait --timeout 10m
          kubectl get pods -n clinicflow
