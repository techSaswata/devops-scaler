# NodePort — opens the same port on EVERY node, reachable from outside.
apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 80              # cluster-internal port (a ClusterIP is still created)
      targetPort: 80        # port on the pod
      nodePort: 30080       # port on EVERY node. Range 30000-32767.
      protocol: TCP
