# Two containers in ONE Pod. They share a network namespace (so they reach each
# other on localhost) and a volume — the sidecar pattern.
apiVersion: v1
kind: Pod
metadata:
  name: multi-container
  labels: { app: multi }
spec:
  volumes:
    - name: shared
      emptyDir: {}                      # lives and dies with the Pod
  containers:
    - name: writer                      # sidecar: produces content
      image: busybox:1.36
      command: ["sh","-c"]
      args:
        - |
          i=0
          while true; do
            i=$((i+1))
            echo "<h1>Written by the sidecar — update #$i</h1>" > /data/index.html
            sleep 5
          done
      volumeMounts:
        - { name: shared, mountPath: /data }
    - name: web                         # main app: serves that content
      image: nginx:1.27-alpine
      volumeMounts:
        - { name: shared, mountPath: /usr/share/nginx/html }
