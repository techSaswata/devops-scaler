# Init containers run to completion, IN ORDER, before any app container starts.
apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels: { app: init-demo }
spec:
  volumes:
    - name: work
      emptyDir: {}
  initContainers:
    - name: init-1-fetch                # must finish before init-2 begins
      image: busybox:1.36
      command: ["sh","-c","echo '[init-1] preparing content'; sleep 3; echo '<h1>Prepared by init containers</h1>' > /work/index.html"]
      volumeMounts: [{ name: work, mountPath: /work }]
    - name: init-2-verify               # must finish before the app starts
      image: busybox:1.36
      command: ["sh","-c","echo '[init-2] verifying'; test -s /work/index.html && echo '[init-2] content OK'; sleep 2"]
      volumeMounts: [{ name: work, mountPath: /work }]
  containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts: [{ name: work, mountPath: /usr/share/nginx/html }]
