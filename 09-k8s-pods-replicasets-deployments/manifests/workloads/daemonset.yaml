# A DaemonSet runs exactly ONE pod on every (eligible) node. You never set
# 'replicas' - the node count decides. Used for log collectors, node exporters
# and CNI agents.
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-agent }
spec:
  selector: { matchLabels: { app: node-agent } }
  template:
    metadata: { labels: { app: node-agent } }
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh","-c","while true; do echo \"[$(date)] agent alive on $NODE_NAME\"; sleep 30; done"]
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          resources: { requests: { cpu: "10m", memory: "16Mi" } }
