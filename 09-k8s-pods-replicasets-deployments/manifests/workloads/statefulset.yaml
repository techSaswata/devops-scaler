# A StatefulSet gives each pod a STABLE, ORDINAL identity: web-0, web-1, web-2.
# Pods are created in order and each gets its own PersistentVolumeClaim.
# Compare with a Deployment, whose pods get random name suffixes and are
# interchangeable.
apiVersion: v1
kind: Service
metadata: { name: stateful-svc }
spec:
  clusterIP: None                 # HEADLESS - gives each pod its own DNS record
  selector: { app: stateful-demo }
  ports: [{ port: 80, name: web }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: web }
spec:
  serviceName: stateful-svc       # must reference the headless Service
  replicas: 3
  selector: { matchLabels: { app: stateful-demo } }
  template:
    metadata: { labels: { app: stateful-demo } }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: web }]
          volumeMounts: [{ name: data, mountPath: /usr/share/nginx/html }]
          resources: { requests: { cpu: "20m", memory: "24Mi" } }
  volumeClaimTemplates:           # one PVC PER POD, not shared
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 64Mi } }
