# CANARY: one Service selects BOTH deployments (they share app: canary-demo),
# so traffic splits in proportion to the replica counts.
# 4 stable + 1 canary  ->  roughly 20% of requests hit the new version.
apiVersion: apps/v1
kind: Deployment
metadata: { name: app-stable }
spec:
  replicas: 4
  selector: { matchLabels: { app: canary-demo, track: stable } }
  template:
    metadata: { labels: { app: canary-demo, track: stable } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["sh","-c","echo STABLE > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
          resources: { requests: { cpu: "20m", memory: "24Mi" } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app-canary }
spec:
  replicas: 1
  selector: { matchLabels: { app: canary-demo, track: canary } }
  template:
    metadata: { labels: { app: canary-demo, track: canary } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["sh","-c","echo CANARY > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
          resources: { requests: { cpu: "20m", memory: "24Mi" } }
---
apiVersion: v1
kind: Service
metadata: { name: canary-service }
spec:
  selector: { app: canary-demo }   # NOTE: no 'track' - matches BOTH deployments
  ports: [{ port: 80, targetPort: 80 }]
