# CRASHLOOPBACKOFF: the container keeps exiting and the default restartPolicy
# (Always) keeps restarting it. Kubernetes backs off exponentially:
# 10s, 20s, 40s, 80s, 160s, capped at 5 minutes.
apiVersion: v1
kind: Pod
metadata: { name: lc-crashloop }
spec:
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh","-c","echo 'starting up...'; sleep 2; echo 'FATAL: cannot reach database'; exit 1"]
