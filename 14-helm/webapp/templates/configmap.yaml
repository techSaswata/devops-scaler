apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html>
    <head><meta charset="utf-8"><title>{{ .Values.config.message }}</title></head>
    <body style="font-family:-apple-system,sans-serif;background:#0f1117;color:#e6e9f0;
                 display:grid;place-items:center;min-height:100vh;margin:0">
      <div style="border:1px solid #252a38;background:#171a23;border-radius:16px;padding:44px 52px">
        <h1 style="margin:0 0 12px">{{ .Values.config.message }}</h1>
        <p style="color:#8b93a7;margin:0 0 20px">Deployed by Helm</p>
        <table style="font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#8b93a7">
          <tr><td style="padding-right:18px">release</td><td style="color:#e6e9f0">{{ .Release.Name }}</td></tr>
          <tr><td>namespace</td><td style="color:#e6e9f0">{{ .Release.Namespace }}</td></tr>
          <tr><td>revision</td><td style="color:#e6e9f0">{{ .Release.Revision }}</td></tr>
          <tr><td>chart</td><td style="color:#e6e9f0">{{ .Chart.Name }}-{{ .Chart.Version }}</td></tr>
          <tr><td>appVersion</td><td style="color:#e6e9f0">{{ .Chart.AppVersion }}</td></tr>
          <tr><td>environment</td><td style="color:#e6e9f0">{{ .Values.config.environment }}</td></tr>
          <tr><td>replicas</td><td style="color:#e6e9f0">{{ .Values.replicaCount }}</td></tr>
        </table>
      </div>
    </body>
    </html>
