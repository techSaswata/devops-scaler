apiVersion: v1
kind: Service
metadata:
  name: {{ include "notes.fullname" . }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { port: {{ .Values.service.port }}, targetPort: http, name: http }
  selector:
    {{- include "notes.selectorLabels" . | nindent 4 }}
