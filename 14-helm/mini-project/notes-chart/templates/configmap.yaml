apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notes.fullname" . }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html><head><meta charset="utf-8"><title>{{ .Values.app.title }}</title></head>
    <body style="font-family:-apple-system,sans-serif;background:#0f1117;color:#e6e9f0;
                 display:grid;place-items:center;min-height:100vh;margin:0">
      <div style="border:1px solid #252a38;background:#171a23;border-radius:16px;padding:40px 48px;max-width:520px">
        <div style="display:inline-block;background:{{ .Values.app.bannerColor }}22;
                    border:1px solid {{ .Values.app.bannerColor }}55;color:{{ .Values.app.bannerColor }};
                    padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
                    letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px">
          {{ .Values.app.environment }}
        </div>
        <h1 style="margin:0 0 10px">{{ .Values.app.title }}</h1>
        <p style="color:#8b93a7;margin:0 0 22px">Packaged and deployed with Helm.</p>
        <table style="font-family:ui-monospace,Menlo,monospace;font-size:13.5px;color:#8b93a7">
          <tr><td style="padding-right:20px">release</td><td style="color:#e6e9f0">{{ .Release.Name }}</td></tr>
          <tr><td>revision</td><td style="color:#e6e9f0">{{ .Release.Revision }}</td></tr>
          <tr><td>replicas</td><td style="color:#e6e9f0">{{ .Values.replicaCount }}</td></tr>
          {{- range $flag, $enabled := .Values.app.featureFlags }}
          <tr><td>flag: {{ $flag }}</td><td style="color:{{ if $enabled }}#6cc24a{{ else }}#f7768e{{ end }}">{{ $enabled }}</td></tr>
          {{- end }}
        </table>
      </div>
    </body></html>
