# ============================================================================
#  EXAMPLE ONLY — DO NOT COMMIT A FILLED-IN COPY OF THIS FILE.
#
#  The secret-scanning job in this pipeline flagged an earlier version of
#  deployment.yaml that embedded literal credentials in `stringData`. That was
#  a genuine finding, not a false positive: a Secret manifest in git is a
#  plaintext credential in git, readable by anyone who can clone the repo and
#  preserved forever in its history.
#
#  Create the Secret OUT OF BAND instead:
#
#     kubectl create secret generic devsecops-demo \
#       --from-literal=DB_PASSWORD='<real value>' \
#       --from-literal=API_KEY='<real value>'
#
#  Note --from-literal, not `echo ... | base64`, which appends a newline into
#  the credential (module 11 demonstrates that bug).
#
#  In production, use one of:
#     - External Secrets Operator  (syncs from Vault / AWS Secrets Manager)
#     - Sealed Secrets             (encrypted, SAFE to commit; only the
#                                   in-cluster controller can decrypt)
#     - the cloud provider's CSI secret driver
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: devsecops-demo
type: Opaque
stringData:
  DB_PASSWORD: REPLACE_ME
  API_KEY: REPLACE_ME
