# gitleaks configuration — secret scanning.
title = "devops-scaler secret scan"

[extend]
useDefault = true          # inherit gitleaks' built-in rule set

[[rules]]
id = "generic-api-key-assignment"
description = "Hard-coded API key or password assignment"
# The capture group is the VALUE, not the label, and secretGroup points at it.
#
# This was wrong at first and the mistake was worth keeping a note about. The
# original regex captured the label -- (api_key|secret|password|...) -- so
# gitleaks treated "PASSWORD" as the secret. Two things followed. The allowlist
# could not be written against the real value, because that was not what the
# rule reported. Worse, `--redact` dutifully hid the label and printed the
# value: findings came out as REDACTED='supplied-at-deploy-time'. A redaction
# that leaks the thing it is redacting is worse than no redaction, because it
# is trusted. Hence the non-capturing (?:...) for the label and secretGroup = 1.
regex = '''(?i)(?:api[_-]?key|secret|passwd|password|token)\s*[:=]\s*["']([A-Za-z0-9/+=_\-]{12,})["']'''
secretGroup = 1
tags = ["key", "generic"]

[allowlist]
description = "Paths that legitimately contain example or test values"
paths = [
  '''.*/outputs/.*\.txt$''',      # captured scanner output quotes findings back
  '''.*/screenshots/.*''',
  '''.*\.md$''',                  # documentation shows example values
  '''security/\.gitleaks\.toml''',  # this file contains the patterns themselves
  '''.*/secret\.example\.yaml$''',  # placeholders only - REPLACE_ME, never real values

  # --- deliberate teaching material, reviewed and justified ---------------
  # Module 11 demonstrates that a Kubernetes Secret is base64-ENCODED, not
  # encrypted, by decoding one. That lesson requires a committed Secret
  # manifest. Its values ("secretpassword", "yatri_admin") are invented for
  # the lab, are documented as such in that module's README, and grant access
  # to nothing. Allowlisted by exact path rather than by rule, so the rule
  # still protects every other file.
  '''11-k8s-ingress-configmaps-secrets/manifests/02-secret\.yaml$''',
  '''11-k8s-ingress-configmaps-secrets/scripts/01-configmaps-secrets\.sh$''',

  # This module's own scan script GENERATES credential-shaped sample lines to
  # show what the scanner looks for. Allowlisted by exact path.
  '''16-devsecops/scripts/01-security-scans\.sh$'''
]

# Allowlisted by VALUE rather than by path, which is the narrowest exception
# available: it excuses exactly one string and nothing else, in any file.
#
# One commit created the final project's demo Secret with the literal
# placeholder 'supplied-at-deploy-time'. It is a placeholder, it was never a
# credential, and it grants access to nothing. The scripts now generate that
# value with `openssl rand` instead, so the string no longer exists in the
# working tree -- but gitleaks scans git HISTORY, so removing it from the files
# did not clear the finding. The honest choice was between rewriting published
# history and recording a justified, value-scoped exception; this is the latter.
regexes = [
  '''supplied-at-deploy-time'''
]
