# hostPath — mounts a path from the NODE's filesystem into the pod.
# Data survives pod deletion, but is tied to ONE node: reschedule the pod
# elsewhere and the data is gone. Also a serious security concern, since the
# pod can read the host filesystem.
apiVersion: v1
kind: Pod
metadata:
  name: vol-hostpath
  labels: { demo: volumes }
spec:
  # Pin to a specific node, otherwise "the data is on the node" means nothing.
  nodeName: devops-hw-worker
  volumes:
    - name: node-disk
      hostPath:
        path: /tmp/hostpath-demo
        type: DirectoryOrCreate
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","echo \"written by $HOSTNAME at $(date)\" >> /host/data.txt; sleep infinity"]
      volumeMounts: [{ name: node-disk, mountPath: /host }]
